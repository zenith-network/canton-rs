[package]
name = "canton-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
canton-crypto = { workspace = true, features = ["v30", "spki"] }
canton-proto = { workspace = true, features = ["std", "prost-types-chrono"] }
canton-types.workspace = true
hex = { workspace = true, features = ["alloc"] }
multihash = { workspace = true, features = ["alloc"] }
multihash-codetable = { workspace = true, features = ["sha2"] }
protobuf-utils.workspace = true
thiserror.workspace = true
