# This workflow is managed by gh actions-lock.

name: Examples

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  check-example:
    name: ${{ matrix.project }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # We're doing simple checks on both examples,
      # so it's fine to use a matrix here (at least for now).
      matrix:
        project:
          - example-daml-project
          - example-ledger-api-project

    defaults:
      run:
        working-directory: examples/${{ matrix.project }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.4.0

      - name: Install Rust
        uses: actions-rs/toolchain@v1.0.7
        with:
          toolchain: "1.99.0"
          default: true
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check --all --verbose

      - name: Install Protoc
        uses: arduino/setup-protoc@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Don't need to install Daml SDK for pure ledger-api project
      - name: Install dpm and Daml SDK
        if: matrix.project == 'example-daml-project'
        uses: zenith-network/setup-daml@v1.0.0
        with:
          dpm-version: "1.0.22"
          sdk-version: "3.6.2"

      - name: Use Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.project }}
          workspaces: examples/${{ matrix.project }}

      - name: Check build
        run: |
          cargo check --workspace --all-targets --all-features --verbose
