[package]
name = "ledger-api-value-proto"
version = "0.1.0"
description = "Protobuf bindings for Ledger API representation of Daml LF value"
edition.workspace = true
license.workspace = true

[features]
default = ["std", "v2"]
std = ["prost/std"]
v2 = []

[dependencies]
prost = { workspace = true, features = ["derive"] }

[build-dependencies]
prost-build.workspace = true
