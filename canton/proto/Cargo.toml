[package]
name = "canton-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["v30"]
v30 = ["admin-api-proto/v30"]
v31 = ["v30"]
v32 = ["v31"]

[dependencies]
admin-api-proto.workspace = true
prost.workspace = true
prost-types = { workspace = true, features = ["std"] }
tonic = { workspace = true, features = ["codegen", "transport"] }
tonic-prost.workspace = true

[build-dependencies]
tonic-prost-build = { workspace = true, features = ["transport"] }
