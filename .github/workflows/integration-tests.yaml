# This workflow is managed by gh actions-lock.

name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  harness:
    name: Sandbox harness
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.4.0
      - name: Install Rust
        uses: actions-rs/toolchain@v1.0.7
        with:
          toolchain: "1.99.0"
          default: true
      - name: Install Protoc
        uses: arduino/setup-protoc@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Use Rust cache
        uses: Swatinem/rust-cache@v2.9.2
      - name: Run tests
        run: |
          cargo test --package sandbox --package sandbox-macro --all-features --verbose

  codegen:
    name: Rust codegen
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.4.0
      - name: Install Rust
        uses: actions-rs/toolchain@v1.0.7
        with:
          toolchain: "1.99.0"
          default: true
      - name: Install Protoc
        uses: arduino/setup-protoc@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dpm and Daml SDK
        uses: zenith-network/setup-daml@v1.0.0
        with:
          dpm-version: "1.0.22"
          sdk-version: "3.6.2"
      - name: Use Rust cache
        uses: Swatinem/rust-cache@v2.9.2
      - name: Run tests
        run: |
          cargo test --package daml-lf-codegen --all-features --test test_codegen --verbose

  ledger-api:
    strategy:
      fail-fast: false
      matrix:
        canton-version: ["3.5.19", "3.6.2"]
    name: Ledger API (Canton ${{ matrix.canton-version }})
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.4.0
      - name: Install Rust
        uses: actions-rs/toolchain@v1.0.7
        with:
          toolchain: "1.99.0"
          default: true
      - name: Install Protoc
        uses: arduino/setup-protoc@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dpm and Daml SDK
        uses: zenith-network/setup-daml@v1.0.0
        with:
          dpm-version: "1.0.22"
          # We install the SDK which is used to build the fixture contracts
          # Specific Canton version is fetched automatically with DPM_AUTO_INSTALL=true
          sdk-version: "3.6.2"
          # Avoid API rate limit
          github-token: ${{ github.token }}
      - name: Install Java Runtime Environment
        uses: actions/setup-java@v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"
          java-package: "jre"
      - name: Use Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: canton-${{ matrix.canton-version }}
      - name: Run tests
        env:
          SANDBOX_CAPACITY: "2"
          SANDBOX_IDLE_TIMEOUT_MS: "3000"
          SANDBOX_BUILD_CANTON_VERSION: ${{ matrix.canton-version }}
          DPM_AUTO_INSTALL: "true"
        run: |
          cargo test --package ledger-api-integration --verbose --test ledger_api_integration
