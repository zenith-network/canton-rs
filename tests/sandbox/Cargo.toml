[package]
name = "sandbox"
version = "0.1.0"
description = "Testing harness which provides Canton sandboxes"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
canton-version.workspace = true
daml-lf.workspace = true
futures-util = { workspace = true, features = ["std"] }
ledger-api-proto = { workspace = true, features = ["v2", "transport"] }
processkit = { workspace = true, features = ["process-control"] }
sandbox-macro.workspace = true
serde_json = { workspace = true, default-features = true }
thiserror.workspace = true
tokio = { workspace = true, features = [
  "rt",
  "process",
  "signal",
  "sync",
  "time",
  "net",
  "fs",
  "io-util",
  "macros",
] }
tokio-util = { workspace = true, features = ["rt"] }
tonic = { workspace = true, features = ["transport"] }
uuid = { workspace = true, features = ["v4"] }

[build-dependencies]
canton-version.workspace = true

[dev-dependencies]
dpm-build.workspace = true
libc.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
