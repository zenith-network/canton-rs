[package]
name = "ledger-api"
version = "0.1.0"
description = "Ledger API client implementation"
edition.workspace = true
license.workspace = true

[features]
default = ["v2", "tls-ring", "tls-webpki-roots"]
tracing = ["dep:tracing", "dep:http"]
v2 = ["ledger-api-proto/v2-full", "ledger-api-types/v2"]
tls-ring = ["tonic/tls-ring"]
tls-aws-lc = ["tonic/tls-aws-lc"]
tls-native-roots = ["tonic/tls-native-roots"]
tls-webpki-roots = ["tonic/tls-webpki-roots"]

[dependencies]
http = { workspace = true, optional = true }
ledger-api-proto.workspace = true
ledger-api-types.workspace = true
protobuf-utils.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-stream.workspace = true
tonic = { workspace = true, features = ["channel"] }
tonic-types.workspace = true
tower = { workspace = true, features = ["retry"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
prost.workspace = true
prost-types.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
