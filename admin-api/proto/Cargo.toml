[package]
name = "admin-api-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["v30"]
v30 = []

[dependencies]
prost.workspace = true
prost-types = { workspace = true, features = ["std", "chrono"] }
tonic = { workspace = true, features = ["codegen", "transport"] }
tonic-prost.workspace = true

[build-dependencies]
tonic-prost-build = { workspace = true, features = ["transport"] }
