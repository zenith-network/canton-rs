[package]
name = "ledger-api-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["std", "client", "transport", "v2"]

# Enables tonic client generation
client = ["std", "dep:tonic", "dep:tonic-prost"]

# Enables tonic server generation
server = ["std", "dep:tonic", "dep:tonic-prost"]

transport = ["client", "tonic/channel"]

# Enables std support
std = ["prost/std", "prost-types/std", "ledger-api-value-proto/std"]

# Enables Ledger API v2
v2 = ["ledger-api-value-proto/v2"]

# Small optional testing unit
v2-testing = ["v2"]

[dependencies]
ledger-api-value-proto.workspace = true
prost = { workspace = true, features = ["derive"] }
prost-types.workspace = true
tonic = { workspace = true, features = ["codegen"], optional = true }
tonic-prost = { workspace = true, optional = true }

[build-dependencies]
glob.workspace = true
tonic-prost-build = { workspace = true, features = ["transport"] }
