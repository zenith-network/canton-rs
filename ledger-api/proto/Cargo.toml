[package]
name = "ledger-api-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["v2"]
v2 = ["ledger-api-value-proto/v2"]
v2-admin = ["v2"]
v2-interactive = ["v2"]
v2-transaction = ["v2-interactive"]
v2-transaction-v1 = ["v2-transaction"]
v2-testing = ["v2"]
v2-full = [
  "v2-admin",
  "v2-interactive",
  "v2-transaction",
  "v2-transaction-v1",
  "v2-testing",
]

[dependencies]
ledger-api-value-proto.workspace = true
prost.workspace = true
prost-types = { workspace = true, features = ["std"] }
thiserror = { workspace = true, optional = true }
tonic = { workspace = true, features = ["codegen", "transport"] }
tonic-prost.workspace = true

[build-dependencies]
tonic-prost-build = { workspace = true, features = ["transport"] }
