[package]
name = "sandbox"
version = "0.1.0"
description = "Testing harness which provides Canton sandboxes"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
canton-version.workspace = true
daml-lf.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
] }
ledger-api-proto = { workspace = true, features = ["v2", "transport"] }
processkit = { version = "=3.3.4", default-features = false, features = [
  "process-control",
] }
sandbox-macro.workspace = true
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = [
  "rt",
  "process",
  "signal",
  "sync",
  "time",
  "net",
  "fs",
  "io-util",
  "macros",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14.6", features = ["transport"] }
uuid = { version = "1.24.1", features = ["v4"] }

[dev-dependencies]
dpm-build.workspace = true
libc = "0.2"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "test-util"] }
