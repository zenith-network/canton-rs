[package]
name = "admin-api-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
# TODO: This feature is misused - this crate doesn't link any system libraries.
#       However currently this is a stable way to expose proto include dir from this crate
#       without relying on the project directory layout. We're basically waiting for Cargo
#       to provide a proper way of doing this.
links = "admin-api-proto"

[features]
default = ["std", "client", "transport"]

# Enables tonic client generation
client = ["std", "dep:tonic", "dep:tonic-prost"]

# Enables tonic server generation
server = ["std", "dep:tonic", "dep:tonic-prost"]

transport = ["client", "tonic/channel"]

# Enables std support
std = ["prost/std", "prost-types/std"]

[dependencies]
prost = { workspace = true, features = ["derive"] }
prost-types.workspace = true
tonic = { workspace = true, features = ["codegen"], optional = true }
tonic-prost = { workspace = true, optional = true }

[build-dependencies]
glob.workspace = true
tonic-prost-build = { workspace = true, features = ["transport"] }
