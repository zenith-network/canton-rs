[package]
name = "canton-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["v30", "spki"]
v30 = []

# Enables decoding of crypto keys with spki
spki = ["dep:spki"]

[dependencies]
canton-proto.workspace = true
canton-types.workspace = true
chrono.workspace = true
hex = { workspace = true, features = ["alloc"] }
multihash = { workspace = true, features = ["alloc"] }
multihash-codetable = { workspace = true, features = ["sha2"] }
protobuf-utils.workspace = true
spki = { workspace = true, features = ["alloc"], optional = true }
thiserror.workspace = true
